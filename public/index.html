<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horas da Semana</title>
<style>
  :root {
    --bg: #191919;
    --border: rgba(255,255,255,0.07);
    --text: #e9e9e7;
    --muted: #8a8a88;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 24px 64px;
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fdfdfc;
    margin: 0 0 4px;
  }

  .periodo {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .abas {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .aba {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 4px 10px;
    margin-right: 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .aba.ativa {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .linha-pessoa {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .linha-pessoa:last-child { border-bottom: none; }

  .ponto {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .linha-pessoa .nome {
    flex: 1;
    font-size: 15px;
  }

  .linha-pessoa .horas {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .cartao-pessoa {
    padding: 22px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .cartao-pessoa:last-child { border-bottom: none; }

  .cartao-info {
    flex: 1;
    min-width: 0;
  }

  .cartao-nome {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .legenda-tag {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    padding: 3px 0;
  }

  .legenda-tag .rotulo {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legenda-tag .quad {
    width: 7px;
    height: 7px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .vazio, .erro {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    padding-top: 8px;
  }
  .erro { color: #ff7369; }
</style>
</head>
<body>
  <h1>Horas da semana</h1>
  <div class="periodo" id="periodo">Carregando…</div>

  <div class="abas">
    <button class="aba ativa" data-aba="resumo">Resumo</button>
    <button class="aba" data-aba="tags">Por tag</button>
  </div>

  <div id="resumo"></div>
  <div id="tags" style="display:none"></div>

  <script>
    const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

    function dataDescritiva(iso) {
      const [ano, mes, dia] = iso.split('-').map(Number);
      return { dia, mes };
    }

    function formatarPeriodo(inicioISO, fimISO) {
      const i = dataDescritiva(inicioISO);
      const f = dataDescritiva(fimISO);
      if (i.mes === f.mes) {
        return `${i.dia} – ${f.dia} de ${MESES[f.mes - 1]}`;
      }
      return `${i.dia} de ${MESES[i.mes - 1]} – ${f.dia} de ${MESES[f.mes - 1]}`;
    }

    document.querySelectorAll('.aba').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.aba').forEach((b) => b.classList.remove('ativa'));
        btn.classList.add('ativa');
        document.getElementById('resumo').style.display = btn.dataset.aba === 'resumo' ? '' : 'none';
        document.getElementById('tags').style.display = btn.dataset.aba === 'tags' ? '' : 'none';
      });
    });

    function fmt(h) {
      return h.toFixed(1).replace('.', ',') + 'h';
    }

    // Cor fixa por tag (independente da pessoa), baseada na paleta de tags do Notion.
    const CORES_TAG = {
      'Atualização do Site/Moodle': '#64748b',
      'Comunicação': '#4c9a2a',
      'Confecção Notícia': '#8a67ab',
      'Design': '#487ca5',
      'Edição conteúdo Instagram': '#b35488',
      'Edição de vídeo Youtube': '#5b6fd8',
      'Escrita/Revisão de artigo': '#3f9142',
      'Evento/Aula do Projeto': '#c98a4b',
      'Leitura Científica': '#3f6fc9',
      'Organização Grupo': '#c4554d',
      'Outros': '#8a8a88',
      'Reunião/Planejamento Reunião': '#976d57',
      'Revisão de vídeo/post': '#a34a86',
    };
    const PALETA_FALLBACK = ['#64748b','#4c9a2a','#8a67ab','#487ca5','#b35488','#5b6fd8','#3f9142','#c98a4b','#3f6fc9','#c4554d','#976d57','#a34a86'];

    function corDaTag(tag) {
      if (CORES_TAG[tag]) return CORES_TAG[tag];
      let hash = 0;
      for (let i = 0; i < tag.length; i++) hash = tag.charCodeAt(i) + ((hash << 5) - hash);
      return PALETA_FALLBACK[Math.abs(hash) % PALETA_FALLBACK.length];
    }

    function desenharRosca(tags) {
      const entradas = Object.entries(tags)
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1]);
      const total = entradas.reduce((s, [, v]) => s + v, 0) || 1;
      const raio = 38, centro = 50, circ = 2 * Math.PI * raio;
      const gap = entradas.length > 1 ? 3 : 0;
      let acumulado = 0;

      const arcos = entradas.map(([tag, valor]) => {
        const fatiaBruta = (valor / total) * circ;
        const fatia = Math.max(fatiaBruta - gap, Math.min(fatiaBruta, 2));
        const offset = circ - acumulado;
        acumulado += fatiaBruta;
        const cor = corDaTag(tag);
        return `<circle cx="${centro}" cy="${centro}" r="${raio}" fill="none" stroke="${cor}"
          stroke-width="12" stroke-linecap="round" stroke-dasharray="${fatia} ${circ - fatia}"
          stroke-dashoffset="${offset}" transform="rotate(-90 ${centro} ${centro})" />`;
      }).join('');

      const svg = `<svg width="104" height="104" viewBox="0 0 100 100">
        <circle cx="${centro}" cy="${centro}" r="${raio}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="12" />
        ${arcos}
        <text x="${centro}" y="${centro + 5}" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="600" fill="#e9e9e7">${fmt(total)}</text>
      </svg>`;

      return { svg, entradas };
    }

    function renderizar(dado) {
      const pessoas = Object.entries(dado.pessoas).sort((a, b) => b[1].total - a[1].total);
      const periodo = document.getElementById('periodo');
      const resumo = document.getElementById('resumo');
      const tagsEl = document.getElementById('tags');

      const periodoTexto = formatarPeriodo(dado.semana.inicio, dado.semana.fim);
      periodo.textContent = periodoTexto;

      if (pessoas.length === 0) {
        resumo.innerHTML = '<div class="vazio">Nenhum registro encontrado nesta semana.</div>';
        tagsEl.innerHTML = '';
        return;
      }

      resumo.innerHTML = pessoas.map(([nome, p]) => `
        <div class="linha-pessoa">
          <span class="ponto" style="background:${p.cor}"></span>
          <span class="nome">${nome}</span>
          <span class="horas">${fmt(p.total)}</span>
        </div>
      `).join('');

      tagsEl.innerHTML = pessoas.map(([nome, p]) => {
        const { svg, entradas } = desenharRosca(p.tags);
        const legenda = entradas.map(([tag, valor]) => `
          <div class="legenda-tag">
            <span class="rotulo"><span class="quad" style="background:${corDaTag(tag)}"></span>${tag}</span>
            <span>${fmt(valor)}</span>
          </div>
        `).join('');
        return `
          <div class="cartao-pessoa">
            ${svg}
            <div class="cartao-info">
              <div class="cartao-nome"><span class="ponto" style="background:${p.cor}"></span>${nome}</div>
              ${legenda}
            </div>
          </div>
        `;
      }).join('');
    }

    function atualizar() {
      fetch('/api/dados')
        .then((r) => r.json())
        .then((dado) => {
          if (dado.error) {
            document.getElementById('periodo').innerHTML = `<span class="erro">Erro: ${dado.error}</span>`;
            return;
          }
          renderizar(dado);
        })
        .catch((err) => {
          document.getElementById('periodo').innerHTML = `<span class="erro">Erro ao carregar: ${err.message}</span>`;
        });
    }

    atualizar();
    setInterval(atualizar, 30000);
  </script>
</body>
</html>
