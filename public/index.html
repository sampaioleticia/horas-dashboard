<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horas da Semana</title>
<style>
  :root {
    --bg: #191919;
    --border: rgba(255,255,255,0.07);
    --text: #e9e9e7;
    --muted: #8a8a88;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 24px 64px;
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fdfdfc;
    margin: 0 0 4px;
  }

  .periodo {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .abas {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    overflow-x: auto;
  }

  .aba {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 4px 10px;
    margin-right: 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .aba.ativa {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .linha-pessoa {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .linha-pessoa:last-child { border-bottom: none; }

  .ponto {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .linha-pessoa .nome {
    flex: 1;
    font-size: 15px;
  }

  .linha-pessoa .horas {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .rosca-wrap {
    display: flex;
    justify-content: center;
    padding: 12px 0 24px;
  }

  .legenda-tag {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
  }

  .legenda-tag .rotulo {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .legenda-tag .quad {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legenda-tag .valores {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
    font-family: var(--sans);
  }

  .legenda-tag .horas-tag {
    font-size: 13px;
    color: var(--text);
  }

  .legenda-tag .pct-tag {
    font-size: 11px;
    color: var(--muted);
    width: 32px;
    text-align: right;
  }

  .vazio, .erro {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    padding-top: 8px;
  }
  .erro { color: #ff7369; }
</style>
</head>
<body>
  <h1>Horas da semana</h1>
  <div class="periodo" id="periodo">Carregando…</div>

  <div class="abas" id="abas"></div>
  <div id="conteudo"></div>

  <script>
    const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    const PESSOAS_FIXAS = ['Giovanna', 'Ana Elisa', 'Ana Beatriz', 'Letícia'];

    let ultimoDado = null;
    let abaAtiva = 'resumo';

    function normalizar(txt) {
      return txt.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function encontrarPessoa(pessoas, rotulo) {
      const alvo = normalizar(rotulo);
      const chave = Object.keys(pessoas).find(
        (nome) => normalizar(nome).includes(alvo) || alvo.includes(normalizar(nome))
      );
      return chave ? pessoas[chave] : null;
    }

    function dataDescritiva(iso) {
      const [ano, mes, dia] = iso.split('-').map(Number);
      return { dia, mes };
    }

    function formatarPeriodo(inicioISO, fimISO) {
      const i = dataDescritiva(inicioISO);
      const f = dataDescritiva(fimISO);
      return `${i.dia} de ${MESES[i.mes - 1]} até ${f.dia} de ${MESES[f.mes - 1]}`;
    }

    function fmt(h) {
      return h.toFixed(1).replace('.', ',') + 'h';
    }

    // Cor fixa por tag (independente da pessoa) — paleta harmônica e legível no fundo escuro.
    const CORES_TAG = {
      'Atualização do Site/Moodle': '#6b8fb5',
      'Comunicação': '#5fae72',
      'Confecção Notícia': '#a084d1',
      'Design': '#5b9bd5',
      'Edição conteúdo Instagram': '#d1729a',
      'Edição de vídeo Youtube': '#7c8ee6',
      'Escrita/Revisão de artigo': '#4fae94',
      'Evento/Aula do Projeto': '#d19a5a',
      'Leitura Científica': '#6a89d8',
      'Organização Grupo': '#d97a6c',
      'Outros': '#c9b45c',
      'Reunião/Planejamento Reunião': '#b08968',
      'Revisão de vídeo/post': '#c26ba0',
    };
    const PALETA_FALLBACK = ['#6b8fb5','#5fae72','#a084d1','#5b9bd5','#d1729a','#7c8ee6','#4fae94','#d19a5a','#6a89d8','#d97a6c','#c9b45c','#b08968','#c26ba0'];

    function corDaTag(tag) {
      if (CORES_TAG[tag]) return CORES_TAG[tag];
      let hash = 0;
      for (let i = 0; i < tag.length; i++) hash = tag.charCodeAt(i) + ((hash << 5) - hash);
      return PALETA_FALLBACK[Math.abs(hash) % PALETA_FALLBACK.length];
    }

    function desenharRosca(tags, corPessoa) {
      const entradas = Object.entries(tags)
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1]);
      const total = entradas.reduce((s, [, v]) => s + v, 0) || 1;
      const raio = 52, centro = 64, circ = 2 * Math.PI * raio;
      const gap = entradas.length > 1 ? 4 : 0;
      let acumulado = 0;

      const arcos = entradas.map(([tag, valor]) => {
        const fatiaBruta = (valor / total) * circ;
        const fatia = Math.max(fatiaBruta - gap, Math.min(fatiaBruta, 3));
        const offset = circ - acumulado;
        acumulado += fatiaBruta;
        const cor = corDaTag(tag);
        return `<circle cx="${centro}" cy="${centro}" r="${raio}" fill="none" stroke="${cor}"
          stroke-width="15" stroke-linecap="round" stroke-dasharray="${fatia} ${circ - fatia}"
          stroke-dashoffset="${offset}" transform="rotate(-90 ${centro} ${centro})" />`;
      }).join('');

      const svg = `<svg width="152" height="152" viewBox="0 0 128 128">
        <circle cx="${centro}" cy="${centro}" r="${raio}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="15" />
        ${arcos}
        <text x="${centro}" y="${centro + 7}" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#fdfdfc">${fmt(total)}</text>
      </svg>`;

      return { svg, entradas, total };
    }

    function montarAbas() {
      const abasEl = document.getElementById('abas');
      const lista = ['Resumo', ...PESSOAS_FIXAS];
      abasEl.innerHTML = lista.map((label) => {
        const chave = label === 'Resumo' ? 'resumo' : label;
        const ativa = chave === abaAtiva ? 'ativa' : '';
        return `<button class="aba ${ativa}" data-aba="${chave}">${label}</button>`;
      }).join('');

      abasEl.querySelectorAll('.aba').forEach((btn) => {
        btn.addEventListener('click', () => {
          abaAtiva = btn.dataset.aba;
          montarAbas();
          renderizarConteudo();
        });
      });
    }

    function renderizarResumo(dado) {
      const pessoas = Object.entries(dado.pessoas).sort((a, b) => b[1].total - a[1].total);
      if (pessoas.length === 0) {
        return '<div class="vazio">Nenhum registro encontrado nesta semana.</div>';
      }
      return pessoas.map(([nome, p]) => `
        <div class="linha-pessoa">
          <span class="ponto" style="background:${p.cor}"></span>
          <span class="nome">${nome}</span>
          <span class="horas">${fmt(p.total)}</span>
        </div>
      `).join('');
    }

    function renderizarPessoa(dado, rotulo) {
      const p = encontrarPessoa(dado.pessoas, rotulo);
      if (!p || p.total <= 0) {
        return '<div class="vazio">Nenhum registro encontrado nesta semana.</div>';
      }
      const { svg, entradas, total } = desenharRosca(p.tags, p.cor);
      const legenda = entradas.map(([tag, valor]) => `
        <div class="legenda-tag">
          <span class="rotulo"><span class="quad" style="background:${corDaTag(tag)}"></span>${tag}</span>
          <span class="valores">
            <span class="horas-tag">${fmt(valor)}</span>
            <span class="pct-tag">${Math.round((valor / total) * 100)}%</span>
          </span>
        </div>
      `).join('');
      return `<div class="rosca-wrap">${svg}</div>${legenda}`;
    }

    function renderizarConteudo() {
      const conteudo = document.getElementById('conteudo');
      if (!ultimoDado) return;
      if (abaAtiva === 'resumo') {
        conteudo.innerHTML = renderizarResumo(ultimoDado);
      } else {
        conteudo.innerHTML = renderizarPessoa(ultimoDado, abaAtiva);
      }
    }

    const INTERVALO_MS = 1000; // atualiza a cada 1 segundo
    let ultimoJSON = '';
    let timer = null;

    function mostrarErro(msg) {
      // Se já temos dados na tela, não apaga nada por causa de uma falha pontual
      if (ultimoDado) { console.warn(msg); return; }
      document.getElementById('periodo').innerHTML = `<span class="erro">${msg}</span>`;
    }

    async function atualizar() {
      clearTimeout(timer);
      try {
        const r = await fetch('/api/dados', { cache: 'no-store' });
        const texto = await r.text();
        const dado = JSON.parse(texto);
        if (dado.error) {
          mostrarErro(`Erro: ${dado.error}`);
        } else if (texto !== ultimoJSON) {
          // Só redesenha quando algo mudou (evita piscar a tela a cada segundo)
          ultimoJSON = texto;
          ultimoDado = dado;
          document.getElementById('periodo').textContent = formatarPeriodo(dado.semana.inicio, dado.semana.fim);
          renderizarConteudo();
        }
      } catch (err) {
        mostrarErro(`Erro ao carregar: ${err.message}`);
      } finally {
        // Agenda a próxima só depois que esta terminou — nunca acumula requisições.
        // Com a aba escondida, pausa (economiza o limite da API do Notion).
        if (!document.hidden) timer = setTimeout(atualizar, INTERVALO_MS);
      }
    }

    // Ao voltar para a aba, atualiza na hora e retoma o ciclo
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) atualizar();
      else clearTimeout(timer);
    });

    montarAbas();
    atualizar();
  </script>
</body>
</html>
